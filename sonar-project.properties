# SonarQube / SonarScanner — конфиг для репозитория k8s-manager (Go).
# Положи этот файл в КОРЕНЬ репозитория рядом с go.mod.
#
# В SonarCloud/SonarQube ключ проекта должен совпадать с sonar.projectKey в UI проекта.

sonar.projectKey=alexsanderknyazev-ops_k8s-manager_e5853d7e-21bc-49d8-bf91-655712deca9e
sonar.projectName=k8s-manager

# Корень исходников (от корня репозитория)
sonar.sources=.

# Кодировка
sonar.sourceEncoding=UTF-8

# --- Исключения анализа (issues, дубли, метрики по этим путям не считаются) ---
# vendor, артефакты сборки, HTML/CSS/JS фронта, миграции SQL, манифесты деплоя,
# служебные каталоги CI/IDE, отчёты покрытия.
sonar.exclusions=**/vendor/**,\
  **/.git/**,\
  **/.github/**,\
  **/.idea/**,\
  **/deploy/**,\
  **/migrations/**,\
  **/static/**,\
  **/templates/**,\
  **/testdata/**,\
  **/node_modules/**,\
  **/coverage.out,\
  **/*.out,\
  **/package.json,\
  **/package-lock.json,\
  **/k8s-manager,\
  **/*.sum,\
  **/Dockerfile,\
  **/docker-compose.yml,\
  **/.dockerignore,\
  main.go

# Исключения из расчёта покрытия (файлы могут попасть в coverage.out, но не режут метрику)
# main.go — только корень проекта (точка входа приложения), не cmd/*/main.go
sonar.coverage.exclusions=**/vendor/**,\
  **/static/**,\
  **/templates/**,\
  **/deploy/**,\
  **/migrations/**,\
  **/testdata/**,\
  **/*.pb.go,\
  **/*_gen.go,\
  main.go

# Тесты Go
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Отчёт покрытия (генерируется в CI: go test ./... -coverprofile=coverage.out)
sonar.go.coverage.reportPaths=coverage.out
