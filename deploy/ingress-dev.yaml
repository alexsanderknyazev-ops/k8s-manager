# Ingress для minikube / локального кластера (без TLS).
# Добавьте в /etc/hosts: <minikube ip> k8s-manager.local
#   minikube ip
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-manager
  namespace: k8s-manager
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "k8s_manager_route"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "86400"
spec:
  ingressClassName: nginx
  rules:
  - host: k8s-manager.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: k8s-manager
            port:
              number: 8080
