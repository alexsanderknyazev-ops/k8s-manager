# Пример Secret для логина/пароля. Создайте и раскомментируйте env в deployment.yaml.
# kubectl create secret generic k8s-manager-auth -n k8s-manager \
#   --from-literal=username=admin \
#   --from-literal=password=your-secret-password
# Либо примените этот манифест (замените base64 на свои значения):
# echo -n 'admin' | base64  -> YWRtaW4=
# echo -n 'your-password' | base64
---
apiVersion: v1
kind: Secret
metadata:
  name: k8s-manager-auth
  namespace: k8s-manager
  labels:
    app: k8s-manager
type: Opaque
stringData:
  username: admin
  password: "CHANGE_ME"
---
