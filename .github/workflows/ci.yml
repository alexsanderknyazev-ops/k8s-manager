name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -race -count=1 ./api/... ./internal/auth/... ./internal/rbac/... ./internal/sessionstore/... ./internal/audit/...

      - name: Smoke OIDC/RBAC flow tests
        run: |
          go test -v -count=1 ./api -run 'TestRBACAllowWithPermissionAndSession|TestRBACDenyWithoutPermissionEvenWithSession|TestPermissionsAPIDeniedWithoutPermissionsResourceAccess'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: k8s-manager:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
