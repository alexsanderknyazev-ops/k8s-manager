<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Manager — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            max-width: 360px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .login-card .card-header {
            background: #fff;
            color: #334155;
            border-bottom: 1px solid #e2e8f0;
            border-radius: 10px 10px 0 0;
            padding: 1.25rem 1.5rem;
        }
        .login-card .card-header h5 { font-weight: 600; font-size: 1rem; }
        .login-card .card-body { padding: 1.5rem; }
        .login-card .btn-primary { background: #475569; border-color: #475569; }
        .login-card .btn-primary:hover { background: #334155; border-color: #334155; }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="card-header">
            <h5 class="mb-0"><i class="fas fa-kubernetes me-2" style="color:#475569"></i>K8s Manager</h5>
            <small class="text-muted">Sign in</small>
        </div>
        <div class="card-body p-4">
            {{if .Error}}
            <div class="alert alert-danger py-2 small">{{.Error}}</div>
            {{end}}
            <form method="post" action="/api/login">
                <input type="hidden" name="next" value="{{.Next}}">
                <div class="mb-3">
                    <label class="form-label small text-muted">Username</label>
                    <input type="text" class="form-control" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted">Password</label>
                    <input type="password" class="form-control" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>
        </div>
    </div>
</body>
</html>
