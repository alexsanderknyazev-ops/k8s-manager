<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Manager - DaemonSets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        {{template "sidebar" .}}
        <div class="main-content-wrap">
    <div class="app-content container-fluid">
        <nav class="breadcrumb-wrap"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/ui/dashboard">Home</a></li><li class="breadcrumb-item active">DaemonSets</li></ol></nav>
        <div class="mb-3">
            <select id="ds-namespace" class="form-select form-select-sm" style="width:auto;"></select>
            <button type="button" class="btn btn-sm btn-outline-primary ms-2" id="ds-refresh"><i class="fas fa-sync-alt me-1"></i>Refresh</button>
        </div>
        <div class="card">
            <div class="card-header"><h5 class="mb-0"><i class="fas fa-server me-2"></i>DaemonSets</h5></div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0">
                        <thead><tr><th>Name</th><th>Namespace</th><th>Ready</th><th>Desired</th><th>Current</th><th>Age</th><th></th></tr></thead>
                        <tbody id="ds-tbody"><tr><td colspan="7" class="text-center text-muted">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer text-muted small"><span id="ds-count">0</span> DaemonSets</div>
        </div>
    </div>
        </div>
    </div>
    <script src="/static/js/common.js"></script>
    <script>
(function(){
    function load(){
        var ns = (document.getElementById('ds-namespace')||{}).value || 'default';
        fetch('/api/daemonsets?namespace='+encodeURIComponent(ns)).then(function(r){return r.json();}).then(function(d){
            var list = d.daemonsets || [];
            document.getElementById('ds-count').textContent = d.count != null ? d.count : list.length;
            var tbody = document.getElementById('ds-tbody');
            if(list.length===0){ tbody.innerHTML='<tr><td colspan="7" class="text-center text-muted">No DaemonSets</td></tr>'; return; }
            tbody.innerHTML = list.map(function(s){
                return '<tr><td>'+escapeHtml(s.name)+'</td><td>'+escapeHtml(s.namespace)+'</td><td>'+(s.ready||0)+'</td><td>'+(s.desired||0)+'</td><td>'+(s.current||0)+'</td><td>'+escapeHtml(s.age||'')+'</td><td><a class="btn btn-sm btn-outline-secondary" href="/api/daemonset/yaml/'+escapeHtml(s.namespace)+'/'+escapeHtml(s.name)+'" target="_blank">YAML</a></td></tr>';
            }).join('');
        });
    }
    loadNamespacesIntoSelect('ds-namespace', true);
    document.getElementById('ds-refresh').onclick = load;
    load();
})();
    </script>
</body>
</html>
