<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Manager - Permissions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="app-layout">
    {{template "sidebar" .}}
    <div class="main-content-wrap">
        <div class="app-content container-fluid">
            <nav class="breadcrumb-wrap"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/ui/dashboard">Home</a></li><li class="breadcrumb-item active">Permissions</li></ol></nav>
            {{if not .PermissionManagementAvailable}}
            <div class="alert alert-info">Permission management is available only with PostgreSQL.</div>
            {{else}}
            <div class="card mb-3">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="fas fa-user-shield me-2"></i>Granular RBAC Permissions</h5>
                    {{if not .ReadOnly}}<button class="btn btn-sm btn-primary" id="perm-add-btn"><i class="fas fa-plus me-1"></i>Add permission</button>{{end}}
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped mb-0">
                            <thead><tr><th>Subject</th><th>Namespace</th><th>Resource</th><th>Verb</th><th>Actions</th></tr></thead>
                            <tbody id="perm-tbody"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
            {{end}}
        </div>
    </div>
</div>

<div class="modal fade" id="permModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Add permission</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
        <input class="form-control mb-2" id="perm-subject" placeholder="subject (email)">
        <input class="form-control mb-2" id="perm-namespace" placeholder="namespace (default or *)" value="*">
        <input class="form-control mb-2" id="perm-resource" placeholder="resource (pods/deployments/*)" value="*">
        <select class="form-select" id="perm-verb"><option value="read">read</option><option value="write">write</option><option value="*">*</option></select>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="perm-save">Save</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/common.js"></script>
<script>
(function(){
    function loadPermissions() {
        apiFetch('/api/permissions').then(function(d){
            var list = d.permissions || [];
            var tbody = document.getElementById('perm-tbody');
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No permissions</td></tr>';
                return;
            }
            tbody.innerHTML = list.map(function(p){
                var q = '?subject='+encodeURIComponent(p.subject)+'&namespace='+encodeURIComponent(p.namespace)+'&resource='+encodeURIComponent(p.resource)+'&verb='+encodeURIComponent(p.verb);
                return '<tr><td>'+escapeHtml(p.subject)+'</td><td>'+escapeHtml(p.namespace)+'</td><td>'+escapeHtml(p.resource)+'</td><td>'+escapeHtml(p.verb)+'</td><td><button class="btn btn-sm btn-outline-danger perm-del" data-q="'+q+'">Delete</button></td></tr>';
            }).join('');
            tbody.querySelectorAll('.perm-del').forEach(function(btn){
                btn.onclick = function(){
                    apiFetch('/api/permissions'+btn.getAttribute('data-q'), { method: 'DELETE' })
                        .then(function(){ showToast('Permission deleted','success'); loadPermissions(); })
                        .catch(function(e){ showToast(e.message,'error'); });
                };
            });
        }).catch(function(e){
            document.getElementById('perm-tbody').innerHTML = '<tr><td colspan="5" class="text-center text-muted">'+escapeHtml(e.message)+'</td></tr>';
        });
    }
    loadPermissions();
    var addBtn = document.getElementById('perm-add-btn');
    if (addBtn) addBtn.onclick = function(){ new bootstrap.Modal(document.getElementById('permModal')).show(); };
    var saveBtn = document.getElementById('perm-save');
    if (saveBtn) saveBtn.onclick = function(){
        var body = {
            subject: document.getElementById('perm-subject').value.trim(),
            namespace: document.getElementById('perm-namespace').value.trim() || '*',
            resource: document.getElementById('perm-resource').value.trim() || '*',
            verb: document.getElementById('perm-verb').value
        };
        apiFetch('/api/permissions', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
            .then(function(){
                bootstrap.Modal.getInstance(document.getElementById('permModal')).hide();
                showToast('Permission granted','success');
                loadPermissions();
            }).catch(function(e){ showToast(e.message,'error'); });
    };
})();
</script>
</body>
</html>
