<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Manager - Audit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        {{template "sidebar" .}}
        <div class="main-content-wrap">
    <div class="app-content container-fluid">
        <nav class="breadcrumb-wrap" aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/ui/dashboard">Home</a></li>
                <li class="breadcrumb-item active">Audit</li>
            </ol>
        </nav>
        <div class="card">
            <div class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2">
                <h5 class="mb-0"><i class="fas fa-history me-2"></i>Audit Log</h5>
                <div class="d-flex gap-2 align-items-center">
                    <select id="audit-limit" class="form-select form-select-sm" style="width:auto;">
                        <option value="50">50</option>
                        <option value="100" selected>100</option>
                        <option value="200">200</option>
                        <option value="500">500</option>
                    </select>
                    <button type="button" class="btn btn-sm btn-outline-primary" id="audit-refresh"><i class="fas fa-sync-alt me-1"></i>Refresh</button>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Method</th>
                                <th>Path</th>
                                <th>Status</th>
                                <th>Username</th>
                                <th>Request ID</th>
                            </tr>
                        </thead>
                        <tbody id="audit-tbody">
                            <tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer text-muted small"><span id="audit-count">0</span> entries</div>
        </div>
    </div>
        </div>
    </div>
    <script src="/static/js/common.js"></script>
    <script>
(function () {
    var limitSelect = document.getElementById('audit-limit');
    var tbody = document.getElementById('audit-tbody');
    var countEl = document.getElementById('audit-count');
    function load() {
        var limit = limitSelect ? limitSelect.value : '100';
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>';
        fetch('/api/audit?limit=' + encodeURIComponent(limit))
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var entries = data.entries || [];
                countEl.textContent = data.count != null ? data.count : entries.length;
                if (entries.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No entries</td></tr>';
                    return;
                }
                tbody.innerHTML = entries.map(function (e) {
                    var time = e.time ? (new Date(e.time)).toLocaleString() : '';
                    var statusClass = e.status >= 400 ? 'text-danger' : (e.status >= 300 ? 'text-warning' : '');
                    return '<tr><td>' + escapeHtml(time) + '</td><td>' + escapeHtml(e.method || '') + '</td><td class="text-break">' + escapeHtml(e.path || '') + '</td><td class="' + statusClass + '">' + (e.status || '') + '</td><td>' + escapeHtml(e.username || '') + '</td><td class="small">' + escapeHtml(e.request_id || '') + '</td></tr>';
                }).join('');
            })
            .catch(function () {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger">Failed to load audit</td></tr>';
            });
    }
    if (limitSelect) limitSelect.addEventListener('change', load);
    document.getElementById('audit-refresh').addEventListener('click', load);
    load();
})();
    </script>
</body>
</html>
