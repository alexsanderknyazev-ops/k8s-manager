<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Manager - Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        {{template "sidebar" .}}
        <div class="main-content-wrap">
    <div class="app-content container-fluid">
        <nav class="breadcrumb-wrap" aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/ui/dashboard">Home</a></li>
                <li class="breadcrumb-item active">Events</li>
            </ol>
        </nav>
        <div class="card">
            <div class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2">
                <h5 class="mb-0"><i class="fas fa-bell me-2"></i>Cluster Events</h5>
                <div class="d-flex flex-wrap gap-2 align-items-center">
                    <select id="events-namespace" class="form-select form-select-sm" style="width:auto;">
                        <option value="default">default</option>
                        <option value="market">market</option>
                        <option value="kube-system">kube-system</option>
                        <option value="all">All Namespaces</option>
                    </select>
                    <select id="events-limit" class="form-select form-select-sm" style="width:auto;">
                        <option value="50">50</option>
                        <option value="100" selected>100</option>
                        <option value="200">200</option>
                        <option value="500">500</option>
                    </select>
                    <button type="button" class="btn btn-sm btn-outline-primary" id="events-refresh"><i class="fas fa-sync-alt me-1"></i>Refresh</button>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0">
                        <thead>
                            <tr>
                                <th>Type</th>
                                <th>Object</th>
                                <th>Kind</th>
                                <th>Namespace</th>
                                <th>Reason</th>
                                <th>Message</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody id="events-tbody">
                            <tr><td colspan="7" class="text-center text-muted">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer text-muted small"><span id="events-count">0</span> events</div>
        </div>
    </div>
        </div>
    </div>
    {{template "scripts-utils" .}}
    <script src="/static/js/common.js"></script>
    <script>
(function () {
    var nsSelect = document.getElementById('events-namespace');
    var limitSelect = document.getElementById('events-limit');
    var tbody = document.getElementById('events-tbody');
    var countEl = document.getElementById('events-count');
    function load() {
        var ns = nsSelect ? nsSelect.value : 'default';
        var limit = limitSelect ? limitSelect.value : '100';
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Loading...</td></tr>';
        fetch('/api/events?namespace=' + encodeURIComponent(ns) + '&limit=' + encodeURIComponent(limit))
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var events = data.events || [];
                countEl.textContent = data.count != null ? data.count : events.length;
                if (events.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No events</td></tr>';
                    return;
                }
                tbody.innerHTML = events.map(function (e) {
                    var typeClass = (e.type === 'Warning') ? 'text-warning' : 'text-info';
                    return '<tr><td><span class="' + typeClass + '">' + escapeHtml(e.type || '') + '</span></td><td>' + escapeHtml(e.object || '') + '</td><td>' + escapeHtml(e.kind || '') + '</td><td>' + escapeHtml(e.namespace || '') + '</td><td>' + escapeHtml(e.reason || '') + '</td><td class="text-break">' + escapeHtml(e.message || '') + '</td><td>' + escapeHtml(e.time || '') + '</td></tr>';
                }).join('');
            })
            .catch(function (err) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">Failed to load events</td></tr>';
            });
    }
    if (nsSelect) nsSelect.addEventListener('change', load);
    if (limitSelect) limitSelect.addEventListener('change', load);
    document.getElementById('events-refresh').addEventListener('click', load);
    loadNamespacesIntoSelect('events-namespace', true);
    load();
})();
    </script>
</body>
</html>
